workflows:
  android-debug:
    name: DubMarker Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Instalar dependências
        script: |
          npm install
          npm install -D @capacitor/assets
      - name: Build web + pasta estática do Capacitor
        script: npm run build:mobile
      - name: Adicionar plataforma Android (se necessário)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Gerar ícones do app
        script: |
          mkdir -p resources
          cp public/icon-512.png resources/icon.png
          npx @capacitor/assets generate --android
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Compilar APK Debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - charleslab@example.com
        notify:
          success: true
          failure: true
